name: Docs                                              # Name of the workflow
on:                                                     # Specifies when it needs to be executed:
  push:                                                 # - whenever some changes are pushed
    branches: [main]                                    # on the main branch;
  workflow_dispatch:                                    # - manually from the workflow dispatch on GitHub.
permissions:                                            # Concedes necessary permissions to both the jobs:
  contents: read                                        # reading the contents of the repository,
  pages: write                                          # publishing the documentation (pages) on GitHub
  id-token: write                                       # and some necessary identification permissions.
jobs:                                                   # Specifies what the workflows actually does: it's made of two jobs
  build:                                                # the first one, called build,
    runs-on: ubuntu-latest                              # executed on the latest version of Ubuntu (runner).
    steps:                                              # Defines the steps of the job:
      - id: sphinx                                      # - executes sphinx-notes/pages@v3 which is a GitHub action
        uses: sphinx-notes/pages@v3                     # that downloads the code, installs python and the docs dependencies and builds the documentation.
        with:                                           # The 'sphinx' ID "captures" the output like the folder of the built pages.
          documentation_path: docs/source
          publish: false                                # It doesn't publish them: that is left to the deploy job;
      - uses: actions/upload-pages-artifact@v5          # - uploads the built pages as an artifact called 'docs'.
        with:
          name: docs
          path: ${{ steps.sphinx.outputs.artifact }}
  deploy:                                               # the second one, called deploy,
    needs: build                                        # starts only when the build job is finished, so the artifact is surely available;
    runs-on: ubuntu-latest                              # executed on the latest version of Ubuntu (runner).
    environment:                                        # Creates an environment for the job.
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:                                              # Defines the steps of the job:
      - id: deployment                                  # - executes actions/deploy-pages@v5 which is a GitHub action
        uses: actions/deploy-pages@v5                   # that publishes the 'docs' artifact on GitHub pages.
        with:                                           # The 'deployment' ID "captures" the output like the page url.
          artifact_name: docs